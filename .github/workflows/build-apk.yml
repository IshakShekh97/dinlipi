name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Permissions needed to create/update releases
permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Bun & Node.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 5. Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Install project dependencies
        run: bun install

      - name: 7. Generate Android native project (Expo CNG)
        run: bunx expo prebuild --platform android --clean

      - name: 8. Build Android Release APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 9. Prepare Output APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/dinlipi-latest.apk \;
          echo "APK successfully prepared:"
          ls -lh output/

      - name: 10. Upload APK to GitHub Artifacts (Immediate Download)
        uses: actions/upload-artifact@v4
        with:
          name: dinlipi-android-apk
          path: output/dinlipi-latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: 11. Publish / Update GitHub Release on Every Push
        uses: softprops/action-gh-release@v2
        with:
          files: output/dinlipi-latest.apk
          name: "Dinlipi Latest (Auto-Build)"
          tag_name: "latest"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Dinlipi (দিনলিপি) Latest Auto-Build 🍃

            > Automatically built on every commit to `main` via GitHub Actions. Zero cloud queue, zero cost.

            ### 📲 Download & Run
            - **Download File**: [**`dinlipi-latest.apk`**](https://github.com/${{ github.repository }}/releases/download/latest/dinlipi-latest.apk)
            - **Commit**: `${{ github.sha }}`
            - **Platform**: Android 8.0+ (Universal APK)
            - **Database**: 100% Offline SQLite with Drizzle ORM

            ### How to Install:
            1. Tap **`dinlipi-latest.apk`** below to download.
            2. Open the downloaded file on your Android phone.
            3. If prompted, allow "Install from this source" in Settings.
            4. Tap **Install** and open Dinlipi!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
